services:
  app:
    image: "${IMAGE_NAME:-ghcr.io/vanrezky/toko-online-filament-5}:${IMAGE_TAG:-production}"
    env_file:
      - .env.production
    environment:
      DB_ROOT_PASSWORD: ""
      OCTANE_SERVER: "${OCTANE_SERVER:-frankenphp}"
      OCTANE_HOST: "${OCTANE_HOST:-0.0.0.0}"
      OCTANE_PORT: "${OCTANE_PORT:-80}"
      OCTANE_HTTPS: "${OCTANE_HTTPS:-false}"
      OCTANE_WORKERS: "${OCTANE_WORKERS:-1}"
      OCTANE_MAX_REQUESTS: "${OCTANE_MAX_REQUESTS:-500}"
      OCTANE_LOG_LEVEL: "${OCTANE_LOG_LEVEL:-warn}"
    ports:
      - "${APP_HTTP_PORT:-80}:80"
      - "${APP_HTTPS_PORT:-443}:443"
    volumes:
      - app-storage:/var/www/html/storage
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - backend
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          php -r '$$socket = @fsockopen("127.0.0.1", (int) (getenv("OCTANE_PORT") ?: 80));
          exit($$socket ? 0 : 1);'
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  worker:
    image: "${IMAGE_NAME:-ghcr.io/vanrezky/toko-online-filament-5}:${IMAGE_TAG:-production}"
    env_file:
      - .env.production
    environment:
      DB_ROOT_PASSWORD: ""
    volumes:
      - app-storage:/var/www/html/storage
    networks:
      - backend
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - php
      - artisan
      - queue:work
      - --sleep=3
      - --tries=3
      - --timeout=90
      - --max-time=3600
    restart: unless-stopped
    stop_grace_period: 90s
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  scheduler:
    image: "${IMAGE_NAME:-ghcr.io/vanrezky/toko-online-filament-5}:${IMAGE_TAG:-production}"
    env_file:
      - .env.production
    environment:
      DB_ROOT_PASSWORD: ""
    volumes:
      - app-storage:/var/www/html/storage
    networks:
      - backend
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - php
      - artisan
      - schedule:work
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  mysql:
    image: mysql/mysql-server:8.0
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:?DB_DATABASE is required}"
      MYSQL_USER: "${DB_USERNAME:?DB_USERNAME is required}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}"
    command:
      - --innodb-buffer-pool-size=256M
      - --max-connections=30
      - --performance-schema=OFF
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - backend
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redis:
    profiles: ["redis"]
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    networks:
      - backend
    restart: unless-stopped
    mem_limit: 96m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  backend:

volumes:
  app-storage:
  mysql-data:
  redis-data:
  caddy-data:
  caddy-config:
