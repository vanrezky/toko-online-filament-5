services:
    laravel.test:
        container_name: laravel-toko-online-filament5
        build:
            context: ./vendor/laravel/sail/runtimes/8.3
            dockerfile: Dockerfile
            args:
                WWWGROUP: "${WWWGROUP:-1000}"
        image: sail-8.3/app
        extra_hosts:
            - "host.docker.internal:host-gateway"
        ports:
            - "${APP_PORT:-80}:80"
        environment:
            WWWUSER: "${WWWUSER:-1000}"
            LARAVEL_SAIL: 1
            XDEBUG_MODE: "${SAIL_XDEBUG_MODE:-off}"
            XDEBUG_CONFIG: "${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}"
            IGNITION_LOCAL_SITES_PATH: "${PWD}"
        volumes:
            - ".:/var/www/html"
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
    mysql:
        image: "mysql/mysql-server:8.0"
        ports:
            - "${FORWARD_DB_PORT:-3310}:3306"
        environment:
            MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
            MYSQL_ROOT_HOST: "%"
            MYSQL_DATABASE: "${DB_DATABASE}"
            MYSQL_USER: "${DB_USERNAME}"
            MYSQL_PASSWORD: "${DB_PASSWORD}"
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - "sail-mysql:/var/lib/mysql"
            - "./vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh"
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - "-p${DB_PASSWORD}"
            interval: 5s
            retries: 10
            start_period: 10s
            timeout: 5s

    redis:
        container_name: redis-toko-online-filament5
        image: "redis:alpine"
        ports:
            - "${FORWARD_REDIS_PORT:-6379}:6379"
        volumes:
            - "${DATA_PATH_HOST:-./.docker}/redis:/data"
        networks:
            - sail
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            retries: 10
            timeout: 5s

    mailpit:
        container_name: mailpit-toko-online-filament5
        image: axllent/mailpit:latest
        ports:
            - "${FORWARD_MAILPIT_PORT:-1025}:1025"
            - "${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"
        networks:
            - sail

    laravel.frankenphp:
        profiles:
            - frankenphp
        build:
            context: .
            dockerfile: docker/frankenphp/Dockerfile
            args:
                WWWUSER: "${WWWUSER:-1000}"
                WWWGROUP: "${WWWGROUP:-1000}"
        image: toko-online-frankenphp
        ports:
            - "${OCTANE_FRANKENPHP_PORT:-8081}:8080"
        environment:
            APP_URL: "http://localhost:${OCTANE_FRANKENPHP_PORT:-8081}"
            OCTANE_SERVER: frankenphp
            OCTANE_WORKERS: "${OCTANE_WORKERS:-1}"
            OCTANE_MAX_REQUESTS: "${OCTANE_MAX_REQUESTS:-500}"
            OCTANE_WATCH: "${OCTANE_WATCH:-1}"
        command:
            - /usr/local/bin/start-frankenphp
        volumes:
            - ".:/var/www/html"
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy

networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
