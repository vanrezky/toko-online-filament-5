name: Deploy to Development

on:
  push:
    branches: [dev]

concurrency:
  group: development-deploy
  cancel-in-progress: false

env:
  PHP_VERSION: "8.3"
  NODE_VERSION: "22"
  DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, bcmath, xml, ctype, json, tokenizer, pdo_mysql, curl, zip, gd, intl
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-progress

      - name: Install NPM dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Clean unwanted files
        run: |
          rm -rf .git .phpunit.cache node_modules tests
          rm -f .env Homestead* auth.json npm-debug.log yarn-error.log .DS_Store

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H -p ${{ secrets.SERVER_SSH_PORT || 22 }} ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: "Pre-deploy: release ownership on server"
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script: |
            set -e
            echo "=== Releasing ownership to deploy user ==="
            sudo chown -R ${{ secrets.SERVER_USER }}:${{ secrets.SERVER_USER }} ${{ env.DEPLOY_PATH }}/storage
            sudo chown -R ${{ secrets.SERVER_USER }}:${{ secrets.SERVER_USER }} ${{ env.DEPLOY_PATH }}/bootstrap/cache
            sudo chown -R ${{ secrets.SERVER_USER }}:${{ secrets.SERVER_USER }} ${{ env.DEPLOY_PATH }}/public/build
            sudo chmod -R 775 ${{ env.DEPLOY_PATH }}/storage
            sudo chmod -R 775 ${{ env.DEPLOY_PATH }}/bootstrap/cache
            sudo chmod -R 775 ${{ env.DEPLOY_PATH }}/public/build
            echo "=== Ownership released ==="

      - name: Create revision marker
        run: |
          echo "${{ github.sha }}" > REVISION
          echo "Deployed at $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> REVISION

      - name: Sync files to server
        run: |
          rsync -rlptDz --delete \
            --chmod=D775,F664 \
            --exclude='.env' \
            --exclude='.git' \
            --exclude='.DS_Store' \
            --exclude='node_modules' \
            --exclude='public/storage' \
            --exclude='storage/app/public/' \
            --exclude='storage/logs/' \
            --exclude='storage/framework/cache/data/' \
            --exclude='storage/framework/sessions/' \
            --exclude='storage/framework/views/' \
            --exclude='bootstrap/cache/*.php' \
            -e "ssh -p ${{ secrets.SERVER_SSH_PORT || 22 }}" \
            ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ env.DEPLOY_PATH }}

      - name: Post-deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ env.DEPLOY_PATH }}

            echo "=== Creating .env file ==="
            cat > .env << ENVEOF
            APP_NAME="TokoOnline Dev"
            APP_ENV=${{ secrets.APP_ENV }}
            APP_KEY=${{ secrets.APP_KEY }}
            APP_DEBUG=${{ secrets.APP_DEBUG }}
            APP_URL=${{ secrets.APP_URL }}

            LOG_CHANNEL=daily
            LOG_DEPRECATIONS_CHANNEL=null
            LOG_LEVEL=debug

            DB_CONNECTION=mysql
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT || '3306' }}
            DB_DATABASE=${{ secrets.DB_DATABASE }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}

            BROADCAST_DRIVER=log
            CACHE_DRIVER=file
            FILESYSTEM_DISK=local
            QUEUE_CONNECTION=database
            SESSION_DRIVER=file
            SESSION_LIFETIME=120
            SESSION_SECURE_COOKIE=false

            REDIS_HOST=${{ secrets.REDIS_HOST || '127.0.0.1' }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD || 'null' }}
            REDIS_PORT=${{ secrets.REDIS_PORT || '6379' }}

            MAIL_MAILER=${{ secrets.MAIL_MAILER || 'log' }}
            MAIL_HOST=${{ secrets.MAIL_HOST }}
            MAIL_PORT=${{ secrets.MAIL_PORT || '587' }}
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            MAIL_ENCRYPTION=tls
            MAIL_FROM_ADDRESS=${{ secrets.MAIL_FROM_ADDRESS }}
            MAIL_FROM_NAME="TokoOnline Dev"

            VITE_APP_NAME="TokoOnline Dev"

            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            OPENAI_ORGANIZATION=${{ secrets.OPENAI_ORGANIZATION }}
            APICOID_API_KEY=${{ secrets.APICOID_API_KEY }}
            ENVEOF

            echo "=== Creating required directories ==="
            mkdir -p storage/app/public
            mkdir -p storage/logs
            mkdir -p storage/framework/cache/data
            mkdir -p storage/framework/views
            mkdir -p storage/framework/sessions
            mkdir -p storage/framework/testing
            mkdir -p bootstrap/cache
            mkdir -p public/build

            echo "=== Ensuring deploy user can write ==="
            sudo chown -R ${{ secrets.SERVER_USER }}:${{ secrets.SERVER_USER }} storage bootstrap/cache public/build
            sudo chmod -R 775 storage bootstrap/cache public/build

            echo "=== Handing runtime paths to www-data ==="
            sudo chown -R www-data:www-data storage bootstrap/cache public/build
            sudo chmod -R 775 storage bootstrap/cache public/build

            echo "=== Removing stale Laravel cache files ==="
            sudo rm -f bootstrap/cache/*.php

            echo "=== Ensuring storage link exists ==="
            rm -rf public/storage
            php artisan storage:link

            echo "=== Clearing caches ==="
            sudo -u www-data php artisan optimize:clear

            echo "=== Running migrations ==="
            sudo -u www-data php artisan migrate --force

            echo "=== Caching configs ==="
            sudo -u www-data php artisan config:cache
            sudo -u www-data php artisan route:cache
            sudo -u www-data php artisan icons:cache
            sudo -u www-data php artisan filament:optimize

            echo "=== Restarting queue workers ==="
            sudo supervisorctl restart laravel-worker-dev:*
            sudo -u www-data php artisan queue:restart

            echo "=== Deployment complete! ==="

      - name: Health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script: |
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8081)
            if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 302 ]; then
              echo "Health check failed with HTTP status $HTTP_STATUS"
              exit 1
            fi
            echo "Health check passed (HTTP $HTTP_STATUS)"

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Development deployment successful for commit ${{ github.sha }}"
          else
            echo "Development deployment failed for commit ${{ github.sha }}"
          fi
