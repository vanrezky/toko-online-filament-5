name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, gd, mysql, zip, redis
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader

      - name: Install NPM dependencies
        run: |
          rm -f package-lock.json
          npm install

      - name: Build assets
        run: npm run build

      - name: Create storage link
        run: php artisan storage:link || true

      - name: Clean unwanted files
        run: |
          rm -rf .git
          rm -rf .github
          rm -f .env
          rm -f Homestead*
          rm -f auth.json
          rm -rf .phpunit.cache
          rm -rf node_modules
          rm -f npm-debug.log
          rm -f yarn-error.log

      - name: Upload to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          source: "./"
          target: ${{ secrets.SERVER_DEPLOY_PATH }}
          overwrite: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    steps:
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Generate .env file from template
        run: |
          sed -e "s/__APP_ENV__/${{ secrets.APP_ENV }}/g" \
              -e "s/__APP_KEY__/${{ secrets.APP_KEY }}/g" \
              -e "s/__APP_DEBUG__/${{ secrets.APP_DEBUG }}/g" \
              -e "s/__APP_URL__/${{ secrets.APP_URL }}/g" \
              -e "s/__DB_HOST__/${{ secrets.DB_HOST }}/g" \
              -e "s/__DB_PORT__/${{ secrets.DB_PORT }}/g" \
              -e "s/__DB_DATABASE__/${{ secrets.DB_DATABASE }}/g" \
              -e "s/__DB_USERNAME__/${{ secrets.DB_USERNAME }}/g" \
              -e "s/__DB_PASSWORD__/${{ secrets.DB_PASSWORD }}/g" \
              -e "s/__QUEUE_CONNECTION__/${{ secrets.QUEUE_CONNECTION }}/g" \
              -e "s/__MAIL_HOST__/${{ secrets.MAIL_HOST }}/g" \
              -e "s/__MAIL_PORT__/${{ secrets.MAIL_PORT }}/g" \
              -e "s/__MAIL_USERNAME__/${{ secrets.MAIL_USERNAME }}/g" \
              -e "s/__MAIL_PASSWORD__/${{ secrets.MAIL_PASSWORD }}/g" \
              -e "s/__MAIL_FROM_ADDRESS__/${{ secrets.MAIL_FROM_ADDRESS }}/g" \
              -e "s/__OPENAI_API_KEY__/${{ secrets.OPENAI_API_KEY }}/g" \
              -e "s/__APICOID_API_KEY__/${{ secrets.APICOID_API_KEY }}/g" \
              .env.template > .env

      - name: Upload .env to server
        run: |
          scp -o StrictHostKeyChecking=no -P ${{ secrets.SERVER_SSH_PORT || 22 }} .env ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_DEPLOY_PATH }}/.env

      - name: Run post-deploy scripts
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_SSH_PORT || 22 }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            cd ${{ secrets.SERVER_DEPLOY_PATH }}
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            chmod -R 775 storage bootstrap/cache 2>/dev/null || true
            php artisan queue:restart 2>/dev/null || true
          EOF
