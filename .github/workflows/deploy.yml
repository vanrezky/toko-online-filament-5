name: Laravel Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, bcmath, xml, ctype, json, tokenizer, pdo_mysql
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader

      - name: Install NPM dependencies
        run: |
          rm -f package-lock.json
          npm install

      - name: Build assets
        run: npm run build

      - name: Create storage link
        run: php artisan storage:link || true

      - name: Clean unwanted files
        run: |
          rm -rf .git
          rm -f .env
          rm -f Homestead*
          rm -f auth.json
          rm -rf .phpunit.cache
          rm -rf node_modules
          rm -f npm-debug.log
          rm -f yarn-error.log

      - name: Upload to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          source: "./"
          target: ${{ secrets.SERVER_DEPLOY_PATH }}
          overwrite: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    steps:
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Create .env file
        run: |
          cat > .env << EOF
          APP_NAME=TokoOnline
          APP_ENV=${{ secrets.APP_ENV }}
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=${{ secrets.APP_DEBUG }}
          APP_URL=${{ secrets.APP_URL }}

          LOG_CHANNEL=daily
          LOG_DEPRECATIONS_CHANNEL=null
          LOG_LEVEL=warning

          DB_CONNECTION=mysql
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT || '3306' }}
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}

          BROADCAST_DRIVER=log
          CACHE_DRIVER=file
          FILESYSTEM_DISK=local
          QUEUE_CONNECTION=database
          SESSION_DRIVER=file
          SESSION_LIFETIME=120

          REDIS_HOST=${{ secrets.REDIS_HOST || '127.0.0.1' }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD || 'null' }}
          REDIS_PORT=${{ secrets.REDIS_PORT || '6379' }}

          MAIL_MAILER=smtp
          MAIL_HOST=${{ secrets.MAIL_HOST }}
          MAIL_PORT=${{ secrets.MAIL_PORT || '587' }}
          MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          MAIL_ENCRYPTION=tls
          MAIL_FROM_ADDRESS=${{ secrets.MAIL_FROM_ADDRESS }}
          MAIL_FROM_NAME="${APP_NAME}"

          VITE_APP_NAME="${APP_NAME}"
          VITE_PUSHER_APP_KEY="${PUSHER_APP_KEY}"
          VITE_PUSHER_HOST="${PUSHER_HOST}"
          VITE_PUSHER_PORT="${PUSHER_PORT}"
          VITE_PUSHER_SCHEME="${PUSHER_SCHEME}"
          VITE_PUSHER_APP_CLUSTER="${PUSHER_APP_CLUSTER}"

          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPENAI_ORGANIZATION=${{ secrets.OPENAI_ORGANIZATION }}
          APICOID_API_KEY=${{ secrets.APICOID_API_KEY }}
          EOF

      - name: Upload .env to server
        run: |
          scp -o StrictHostKeyChecking=no -P ${{ secrets.SERVER_SSH_PORT || 22 }} .env ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_DEPLOY_PATH }}/.env

      - name: Run post-deploy scripts
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_SSH_PORT || 22 }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            cd ${{ secrets.SERVER_DEPLOY_PATH }}

            # Create missing directories
            mkdir -p storage/logs
            mkdir -p storage/framework/cache/data
            mkdir -p storage/framework/views
            mkdir -p storage/framework/sessions
            mkdir -p storage/framework/testing
            mkdir -p bootstrap/cache

            # Set permissions (www-data user for Apache/Nginx)
            chown -R www-data:www-data storage bootstrap/cache
            chmod -R 775 storage
            chmod -R 775 bootstrap/cache

            # Clear all cache
            php artisan optimize:clear 2>/dev/null || true
            rm -rf bootstrap/cache/*.php 2>/dev/null || true
            rm -rf storage/framework/cache/data/* 2>/dev/null || true

            # Run migrations
            php artisan migrate --force

            # Cache configs
            php artisan optimize
            php artisan icons:cache
            php artisan filament:optimize

            # Re-apply permissions after caching
            chmod -R 775 storage
            chmod -R 775 bootstrap/cache

            # Restart queue workers
            php artisan queue:restart 2>/dev/null || true
          EOF
