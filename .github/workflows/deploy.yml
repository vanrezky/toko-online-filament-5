name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, gd, mysql, zip, redis
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader

      - name: Install NPM dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Create storage link
        run: php artisan storage:link || true

      - name: Deploy to server via Rsync
        uses: up9cloud/action-rsync@v1
        with:
          hosts: ${{ secrets.SERVER_HOST }}
          user: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ./
          target: ${{ secrets.SERVER_DEPLOY_PATH }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          args: --delete --exclude='.git' --exclude='.github' --exclude='.env' --exclude='.env.*' --exclude='node_modules' --exclude='vendor' --exclude='.phpunit.cache' --exclude='npm-debug.log' --exclude='yarn-error.log' --exclude='Homestead*' --exclude='auth.json'

  post-deploy:
    needs: build-deploy
    runs-on: ubuntu-latest

    steps:
      - name: Deploy script
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.SERVER_DEPLOY_PATH }}
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache
            chmod -R 775 storage bootstrap/cache 2>/dev/null || true
            php artisan queue:restart 2>/dev/null || true